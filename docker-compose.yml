services:

  postgres-db:
    image: postgres:17
    container_name: school_postgres

    environment:
      POSTGRES_DB: school_management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data


  app:
    build: .

    container_name: school_app

    depends_on:
      - postgres-db

    ports:
      - "8081:8081"

    env_file:
      - .env.docker


volumes:
  postgres-data: