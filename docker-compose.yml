services:

  postgres-db:
    image: postgres:17
    container_name: school_postgres

    environment:
      POSTGRES_DB: school_management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data


  eureka-server:
    build:
      context: ./eureka-server

    container_name: eureka_server

    ports:
      - "8761:8761"


  school-service:
    build:
      context: ./school-server

    container_name: school_service

    depends_on:
      - postgres-db
      - eureka-server

    ports:
      - "8081:8081"

    env_file:
      - ./school-server/.env.docker


  gateway:
    build:
      context: ./gateway

    container_name: api_gateway

    depends_on:
      - eureka-server
      - school-service

    ports:
      - "8080:8080"

    env_file:
      - ./gateway/.env.docker


volumes:
  postgres-data: